name: Card Bot $100 Paper Month

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - claude/sports-card-market-strategy-pmtn58
    paths:
      - "prehype/**"
      - ".github/workflows/card-bot-paper.yml"
  schedule:
    # 14:30 UTC daily (09:30 EST / 10:30 EDT)
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: card-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest
      - name: Test (offline)
        run: python -m pytest -q
      - name: Run 30-day paper experiment
        if: github.event_name != 'pull_request'
        run: python -m prehype.paper_bot run --ledger data/card_bot_100.json
      - name: Show scouting results in GitHub Actions summary
        if: github.event_name != 'pull_request'
        run: |
          if [ -f CARD_BOT_DASHBOARD.md ]; then
            cat CARD_BOT_DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scanner did not produce a scouting report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit paper ledger and scouting board
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add CARD_BOT_DASHBOARD.md data/card_bot_scouting_latest.json
          if [ -f data/card_bot_100.json ]; then
            git add data/card_bot_100.json
          fi
          if git diff --cached --quiet; then
            echo "No scouting/ledger changes"
          else
            git commit -m "Paper bot: daily scouting board and ledger"
            git push
          fi
