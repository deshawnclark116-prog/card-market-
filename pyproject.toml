[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prehype"
version = "0.1.0"
description = "Find sports cards before the hype prices them in."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Google Trends hype meter (breakouts re-ranking). Optional: the tool degrades
# gracefully without it.
trends = ["pytrends>=4.9"]
dev = ["pytest>=7", "pytrends>=4.9"]

[project.scripts]
prehype = "prehype.cli:main"

[tool.setuptools.packages.find]
include = ["prehype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
